name: Wallet RPC release

on:
  push:
    tags:
      - "wallet-rpc-v*"

permissions: {}

concurrency:
  group: wallet-rpc-release
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
    uses: ./.github/workflows/wallet-rpc-ci.yml # zizmor: ignore[self-repository]

  image:
    name: Publish image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # wallet-rpc-v0.18.5.4, or wallet-rpc-v0.18.5.4-rc.1 for a test build
      - name: Resolve image tag
        id: meta
        env:
          MONERO_VERSION: ${{ needs.checks.outputs.monero-version }}
        run: |
          version="${GITHUB_REF_NAME#wallet-rpc-v}"
          if [[ "$version" != "$MONERO_VERSION" && "$version" != "$MONERO_VERSION"-* ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match MONERO_VERSION ${MONERO_VERSION} in wallet-rpc/Dockerfile" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9.]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' has an invalid suffix" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/monero-merchant-wallet-rpc"
          {
            echo "version=${version}"
            echo "image=${image}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: wallet-rpc
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Smoke test published image
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          MONERO_VERSION: ${{ needs.checks.outputs.monero-version }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            output="$(docker run --rm --platform "$platform" "$REF" --version)"
            echo "${platform}: ${output}"
            if [[ "$output" != *"v${MONERO_VERSION}-release"* ]]; then
              echo "Expected monero-wallet-rpc v${MONERO_VERSION} on ${platform}" >&2
              exit 1
            fi
          done

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published ${IMAGE}"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo
            echo "Pinned reference:"
            echo
            echo "\`${IMAGE}:${VERSION}@${DIGEST}\`"
            echo
            echo "Verify: \`gh attestation verify oci://${IMAGE}@${DIGEST} --owner ${GITHUB_REPOSITORY_OWNER}\`"
          } >> "$GITHUB_STEP_SUMMARY"
