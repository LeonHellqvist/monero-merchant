name: Wallet RPC CI

on:
  pull_request:
    paths:
      - "wallet-rpc/**"
      - ".github/workflows/wallet-rpc-ci.yml"
  push:
    branches: [main]
    paths:
      - "wallet-rpc/**"
      - ".github/workflows/wallet-rpc-ci.yml"
  workflow_call:
    outputs:
      monero-version:
        value: ${{ jobs.build.outputs.monero-version }}

permissions: {}

concurrency:
  group: wallet-rpc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      monero-version: ${{ steps.version.outputs.monero-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Monero version
        id: version
        run: |
          version="$(sed -n 's/^ARG MONERO_VERSION=//p' wallet-rpc/Dockerfile)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not read MONERO_VERSION from wallet-rpc/Dockerfile" >&2
            exit 1
          fi
          echo "monero-version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: wallet-rpc
          platforms: linux/amd64
          load: true
          tags: wallet-rpc:ci
          cache-from: type=gha,scope=wallet-rpc
          cache-to: type=gha,scope=wallet-rpc,mode=max

      - name: Smoke test
        env:
          MONERO_VERSION: ${{ steps.version.outputs.monero-version }}
        run: |
          output="$(docker run --rm wallet-rpc:ci --version)"
          echo "$output"
          if [[ "$output" != *"v${MONERO_VERSION}-release"* ]]; then
            echo "Expected monero-wallet-rpc v${MONERO_VERSION}" >&2
            exit 1
          fi
