name: POS CI

on:
  pull_request:
    paths:
      - "pos/**"
      - ".github/workflows/pos-ci.yml"
  push:
    branches: [main]
    paths:
      - "pos/**"
      - ".github/workflows/pos-ci.yml"
  workflow_call:

permissions: {}

concurrency:
  group: pos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # Also validates gradle-wrapper.jar against Gradle's published checksums
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and unit test
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Preview is a release build, so this runs the release lint checks too
        run: |
          ./gradlew assemblePreview testDebugUnitTest
          # The artifact keeps this file name, since it's uploaded without a zip
          mv app/build/outputs/apk/preview/app-preview.apk "monero-merchant-pos-${PR_NUMBER:+pr$PR_NUMBER-}${GITHUB_SHA::7}.apk"

      - name: Upload preview APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: pos/monero-merchant-pos-*.apk
          # A plain APK can be downloaded and installed straight on a phone
          archive: false
          if-no-files-found: error
          retention-days: 7
