version: 2

# One grouped PR per ecosystem each month, plus security fixes as they come.
# New releases must be a week old before they are picked up.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /gateway, /wallet-rpc]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      backend-go:
        patterns: ["*"]
      backend-go-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /pos
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pos-gradle:
        patterns: ["*"]
      pos-gradle-security:
        applies-to: security-updates
        patterns: ["*"]
